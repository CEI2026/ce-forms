<!--
  Squarespace embed snippet for the ESCO Qualification Form
  ==========================================================
  CANONICAL SOURCE of the contents of the Code Block on the
  "ESCO Assessment Form" page at catholicenergies.org.

  This file is NOT served by Netlify — it exists so the embed
  snippet is version-controlled. If the Squarespace block is ever
  lost, mangled, or needs re-creating, paste the body below
  (everything after this comment) into a plain CODE block
  (NOT an "Embed" block — the Embed block type wraps content in a
  16:9 video letterbox container, which renders black pillar bars
  around the form; discovered and fixed 2026-08-10).

  How it works: the iframe loads the live form from Netlify; the
  form's ce-esco.js posts its content height (ceEscoHeight) on
  load, step change, and resize, and requests a parent scroll
  (ceEscoScroll) on step navigation. The listener below resizes
  the iframe to fit and scrolls it into view — which is what keeps
  the Squarespace footer correctly below the form at every step.
-->
<iframe id="ce-esco-frame" src="https://ce-esco-form.netlify.app/"
        style="width:100%;border:0;display:block" height="1200"
        scrolling="no" title="ESCO Assessment Form"></iframe>
<script>
(function () {
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    var f = document.getElementById('ce-esco-frame');
    if (!f) return;
    if (d.ceEscoHeight) { f.style.height = d.ceEscoHeight + 'px'; }
    if (d.ceEscoScroll) { f.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
})();
</script>
