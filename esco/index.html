<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ESCO Qualification &#8212; Catholic Energies</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     ESCO Qualification form — EMBED build.
     Designed to sit inside catholicenergies.org/forms/esco-qualification,
     which already provides the CE white header nav and black footer.
     So this form drops its own masthead/footer and renders on white.
     ============================================================ */
  :root{
    --ink:#2E2E2E;
    --muted:#6B6660;
    --help:#4A453F;
    --line:#E3DFD8;
    --line-soft:#EFEBE4;
    --panel:#FFFFFF;
    --orange:#E08A2C;
    --orange-dk:#C4652C;
    --orange-lt:#E8983F;
    --orange-soft:#FBEEE1;
    --grad:linear-gradient(100deg,#E8983F 0%,#C4652C 100%);
    --green:#3F9F52;
    --err:#B23A2E;
    --radius:14px;
    --shadow:0 1px 2px rgba(40,40,40,.04),0 10px 30px rgba(40,40,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#FFFFFF}
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--orange-dk)}
  .wrap{max-width:840px;margin:0 auto;padding:28px 20px 56px}

  /* ---------------- Intro ---------------- */
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--grad);color:#fff;font-weight:700;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;
    padding:9px 16px;border-radius:99px;box-shadow:0 4px 12px rgba(196,101,44,.24);
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9}
  h1.title{font-size:40px;line-height:1.06;font-weight:800;letter-spacing:-.015em;margin:16px 0 6px;color:var(--ink)}
  .subtitle{color:var(--muted);font-size:17px;max-width:60ch;margin:0}
  @media(max-width:640px){h1.title{font-size:30px}.subtitle{font-size:15px}}

  /* ---------------- Progress + stepper ---------------- */
  .progress-track{height:7px;border-radius:99px;background:var(--line-soft);margin:26px 0 18px;overflow:hidden}
  .progress-fill{height:100%;border-radius:99px;background:var(--grad);width:8%;transition:width .35s ease}

  .stepper{
    display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px;
  }
  .stp{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .stp .num{
    width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
    font-size:12.5px;font-weight:700;color:var(--muted);background:#fff;border:1.5px solid var(--line);transition:.2s;
  }
  .stp .lbl{font-size:12px;font-weight:600;color:var(--muted);white-space:normal;line-height:1.12;max-width:72px;transition:.2s}
  .stp.active .num{background:var(--grad);border-color:transparent;color:#fff}
  .stp.done .num{background:var(--green);border-color:transparent;color:#fff}
  .stp.active .lbl{color:var(--ink)}
  .stp-line{flex:1 1 8px;min-width:8px;height:1.5px;background:var(--line);margin:0 5px}
  @media(max-width:720px){.stp .lbl{display:none}.stp-line{margin:0 5px}}

  /* ---------------- Step card ---------------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:20px;overflow:hidden}
  .step{display:none;padding:26px 26px 8px}
  .step.active{display:block;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .step-head{border-bottom:1px solid var(--line-soft);padding-bottom:16px;margin-bottom:20px}
  .step-head h2{font-size:20px;font-weight:800;margin:0;color:var(--ink)}
  .step-head p{color:var(--muted);font-size:13.5px;margin:4px 0 0}

  .divider{display:flex;align-items:center;gap:14px;margin:26px 0 18px;color:var(--muted);
    font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-soft)}

  /* ---------------- Fields ---------------- */
  .field{margin-bottom:20px}
  .field > .flabel{display:block;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
  .req{color:var(--orange-dk);font-weight:800}
  .fhelp{display:block;font-weight:400;letter-spacing:0;text-transform:none;color:var(--help);font-size:13px;margin:4px 0 10px}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=url],input[type=date],textarea,select{
    width:100%;font:inherit;font-size:15px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .15s,box-shadow .15s;
  }
  ::placeholder{color:#AEA79C}
  textarea{min-height:92px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
  .money{position:relative}.money::before{content:"$";position:absolute;left:14px;top:12px;color:var(--muted)}.money input{padding-left:26px}

  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt label{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s;background:#fff;height:100%}
  .opt .box{flex:0 0 auto;width:19px;height:19px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;transition:.15s}
  .opt .box svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:.15s;color:#fff}
  .opt input:checked + label{border-color:var(--orange);background:var(--orange-soft)}
  .opt input:checked + label .box{background:var(--grad);border-color:transparent}
  .opt input:checked + label .box svg{opacity:1;transform:scale(1)}
  .opt input:focus-visible + label{box-shadow:0 0 0 3px var(--orange-soft)}

  .yn{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .yn label{padding:11px 26px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;color:var(--muted)}
  .yn label + label{border-left:1px solid var(--line)}
  .yn input{position:absolute;opacity:0;pointer-events:none}
  .yn input:checked + label{background:var(--grad);color:#fff}

  /* state grid */
  .stategrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
  .stchip{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 0;cursor:pointer;text-align:center;transition:.12s}
  .stchip:hover{border-color:var(--muted)}
  .stchip.on{background:var(--grad);border-color:transparent;color:#fff}
  .stchip:focus-visible{outline:none;box-shadow:0 0 0 3px var(--orange-soft)}
  .stcount{margin-top:14px;font-size:13.5px;color:var(--muted);font-weight:600}
  .stcount b{color:var(--orange-dk)}
  @media(max-width:760px){.stategrid{grid-template-columns:repeat(6,1fr)}}
  @media(max-width:440px){.stategrid{grid-template-columns:repeat(5,1fr)}}

  /* nav */
  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 26px 26px}
  button{font:inherit;font-weight:700;font-size:14.5px;border-radius:11px;cursor:pointer;border:1px solid transparent;padding:13px 26px;transition:.15s}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(196,101,44,.24)}
  .btn-primary:hover{filter:brightness(1.04)}
  .btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--muted)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .err-msg{color:var(--err);font-size:12.5px;margin-top:6px;display:none;font-weight:600}
  .field.invalid .err-msg{display:block}
  .field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--err)}

  .review-grp{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:16px}
  .review-grp h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-dk)}
  .review dt{font-size:12px;font-weight:700;color:var(--muted);margin-top:10px}
  .review dd{margin:2px 0 0;font-size:14px;word-break:break-word}

  .done{text-align:center;padding:44px 16px}
  .done .ring{width:72px;height:72px;border-radius:50%;background:var(--orange-soft);display:grid;place-items:center;margin:0 auto 18px}
  .done h2{margin:0 0 8px;font-size:24px;font-weight:800}
  .done p{color:var(--muted);max-width:46ch;margin:0 auto;font-size:15px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><span class="dot"></span>ESCO Qualification</div>
    <h1 class="title">ESCO Qualification Form</h1>
    <p class="subtitle">Complete all sections to be considered as a vetted Catholic Energies service delivery partner.</p>

    <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
    <div class="stepper" id="stepper"></div>

    <div class="card">
      <div id="steps"></div>
      <div class="nav" id="nav">
        <button type="button" class="btn-ghost" id="back" style="visibility:hidden">Back</button>
        <button type="button" class="btn-primary" id="next">Continue</button>
      </div>
    </div>
  </div>

<script src="ce-esco.js"></script>
</body>
</html>
