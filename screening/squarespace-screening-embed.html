<!-- Catholic Energies · Energy Screening · Squarespace CODE block (NOT an Embed block)
     Paste into a CODE block on the Energy Screening page. Same handshake as the ESCO
     and community forms (ceEscoHeight / ceEscoScroll). -->
<div id="ce-screening-wrap" style="width:100%;max-width:800px;margin:0 auto;">
  <iframe id="ce-screening-frame"
          src="https://ce-screening-form.netlify.app/"
          title="Catholic Energies Energy Screening"
          style="width:100%;border:0;display:block;min-height:900px;"
          scrolling="no"></iframe>
</div>
<script>
(function(){
  var f=document.getElementById('ce-screening-frame');
  window.addEventListener('message',function(e){
    if(!e.data) return;
    if(typeof e.data.ceEscoHeight==='number'){ f.style.height=(e.data.ceEscoHeight+20)+'px'; }
    if(e.data.ceEscoScroll){ var r=f.getBoundingClientRect(); window.scrollTo({top:window.scrollY+r.top-24,behavior:'smooth'}); }
  });
})();
</script>
