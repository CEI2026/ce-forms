<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Assessment Resource Center</title>
<!--
  Energy Assessment Resource Center - Instant Audit panel + bill upload (Desk audit) v0.2, 2026-10-07.
  Spec: UI_and_Middleware_Build_Spec.md. This page never scores and never writes its own result
  words: it shows exactly what ce-web-to-sf-middleware returns (rule 1 and rule 5 of the spec).
  Static, no build step. Netlify: publish directory = resource-center.
-->
<style>
  :root{
    --ink:#1f2a33; --muted:#5d6b76; --line:#d5dbe0; --bg:#ffffff; --panel:#f7f8f9;
    --accent:#d9631e; --accent-dark:#b24f14; --focus:#1b5fa8;
    --ok-bg:#e6f4ea; --ok-ink:#1e6b34; --warn-bg:#fff4d6; --warn-ink:#7a5b00;
    --neutral-bg:#eceff1; --neutral-ink:#37474f; --err:#b3261e; --err-bg:#fdecea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  h1{font-size:1.6rem;margin:0 0 4px}
  h2{font-size:1.2rem;margin:0 0 4px}
  h3{font-size:1rem;margin:16px 0 6px}
  p{margin:0 0 10px}
  .lede{color:var(--muted);margin-bottom:16px}
  .rule{height:3px;background:var(--accent);border:0;margin:10px 0 18px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .step .num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:.8rem;font-weight:600;align-items:center;justify-content:center;margin-right:8px}
  .step-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
  .step-head .title{font-weight:600}
  .step-head .sel{color:var(--muted);flex:1;min-width:200px}
  .linkbtn{background:none;border:0;color:var(--focus);text-decoration:underline;cursor:pointer;font:inherit;padding:2px 4px}
  .grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:860px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
  input[type=text],input[type=email],input[type=tel],input[type=month],select,textarea{
    width:100%;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;
    font:inherit;color:var(--ink)}
  textarea{height:auto;padding:8px 10px}
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
  .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
  .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
  @media (max-width:560px){.row3,.row2{grid-template-columns:1fr}}
  .field{margin-bottom:10px}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:.95rem;color:var(--ink);margin:4px 0}
  .check input{margin-top:4px}
  .small{font-size:.85rem;color:var(--muted)}
  button.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;height:44px;padding:0 18px;
    font:inherit;font-weight:600;cursor:pointer;width:100%}
  button.primary:hover{background:var(--accent-dark)}
  button.primary:disabled{background:#c9ced2;cursor:not-allowed}
  button.secondary,a.secondary{display:inline-block;background:#fff;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;height:38px;line-height:36px;padding:0 14px;font:inherit;cursor:pointer;text-decoration:none}
  .tablewrap{overflow-x:auto;margin:8px 0}
  table.grid{border-collapse:collapse;width:100%;min-width:560px}
  table.grid th{font-size:.8rem;color:var(--muted);text-align:left;font-weight:500;padding:2px 4px}
  table.grid td{padding:2px}
  table.grid td.m{white-space:nowrap;padding:2px 6px;font-size:.9rem}
  table.grid input{height:34px;font-size:.9rem;padding:0 6px;text-align:right}
  table.grid tfoot td{border-top:1px solid var(--line);font-weight:600;padding:6px 6px;font-size:.9rem;text-align:right}
  table.grid tfoot td:first-child{text-align:left}
  table.grid input.bad{border-color:var(--err);background:var(--err-bg)}
  .hint{font-size:.85rem;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:6px 10px;margin:6px 0}
  .okline{font-size:.85rem;color:var(--ok-ink);margin:6px 0}
  .errbox{background:var(--err-bg);color:var(--err);border-radius:8px;padding:10px 12px;margin:10px 0}
  .errbox ul{margin:6px 0 0 18px;padding:0}
  .ferr{color:var(--err);font-size:.85rem;margin-top:2px}
  .bad{border-color:var(--err)!important}
  .hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  .results{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .chip{display:inline-block;font-weight:600;padding:5px 14px;border-radius:999px}
  .chip.green{background:var(--ok-bg);color:var(--ok-ink)}
  .chip.yellow{background:var(--warn-bg);color:var(--warn-ink)}
  .chip.red,.chip.neutral{background:var(--neutral-bg);color:var(--neutral-ink)}
  .spend{font-size:1.5rem;font-weight:700;margin:8px 0 0}
  .basis{font-size:.85rem;color:var(--muted);margin-bottom:10px}
  .results ul{padding-left:18px;margin:0 0 10px}
  .results li{margin-bottom:6px}
  .buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .spinner{display:inline-block;width:16px;height:16px;border:3px solid #cfd5da;border-top-color:var(--accent);
    border-radius:50%;animation:sp 0.9s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .disabledpanel{opacity:.75}
  .lookup-list{list-style:none;margin:8px 0 0;padding:0}
  .lookup-list li{margin:0}
  .lookup-list button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;margin-bottom:6px;font:inherit;cursor:pointer}
  .lookup-list button:hover{border-color:var(--accent)}
  .lookup-list .addr{display:block;font-size:.85rem;color:var(--muted)}

  .drop{border:2px dashed var(--line);border-radius:10px;padding:20px 12px;text-align:center;background:#fff;cursor:pointer}
  .drop:hover,.drop.over{border-color:var(--accent);background:#fff8f3}
  .filelist{list-style:none;margin:8px 0 0;padding:0}
  .filelist li{display:flex;gap:8px;align-items:center;font-size:.9rem;padding:4px 0;border-bottom:1px solid var(--line)}
  .filelist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filelist .st{font-size:.8rem;color:var(--muted);white-space:nowrap}
  .filelist .st.ok{color:var(--ok-ink)} .filelist .st.fail{color:var(--err)}
  .filelist button{background:none;border:0;color:var(--focus);cursor:pointer;font:inherit;text-decoration:underline}
  .okbox{background:var(--ok-bg);color:var(--ok-ink);border-radius:8px;padding:12px 14px;margin:6px 0 10px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="s-title"></h1>
  <p class="lede" id="s-lede"></p>
  <hr class="rule">

  <!-- STEP 1: institution and building -->
  <section class="step" id="step1" aria-labelledby="step1-title">
    <div class="step-head">
      <span class="num">1</span>
      <span class="title" id="step1-title"></span>
      <span class="sel" id="step1-sel"></span>
      <button class="linkbtn" id="step1-change" hidden></button>
    </div>
    <div id="step1-body">
      <div id="lk-zip">
        <div class="row2" style="margin-top:10px;align-items:end">
          <div>
            <label for="zip" id="s-zip-label"></label>
            <input type="text" id="zip" inputmode="numeric" maxlength="10" autocomplete="postal-code">
          </div>
          <div><button class="secondary" id="zip-go" type="button"></button></div>
        </div>
      </div>
      <div id="lk-status" class="small" role="status" aria-live="polite"></div>
      <ul class="lookup-list" id="lk-accounts"></ul>
      <ul class="lookup-list" id="lk-buildings"></ul>
      <div id="lk-manual" hidden>
        <h3 id="s-manual-title"></h3>
        <div class="row2">
          <div><label for="m-name" id="s-mname"></label><input type="text" id="m-name"></div>
          <div><label for="m-addr" id="s-maddr"></label><input type="text" id="m-addr"></div>
        </div>
        <button class="secondary" id="m-use" type="button"></button>
      </div>
    </div>
  </section>

  <!-- STEP 2: panels -->
  <div class="grid2" id="step2" hidden>
    <!-- LEFT: Instant audit -->
    <section class="panel" id="ia-panel" aria-labelledby="ia-title">
      <h2 id="ia-title"></h2>
      <p class="small" id="ia-sub"></p>

      <div id="ia-form">
        <div class="row3">
          <div class="field">
            <label for="sqft" id="s-sqft"></label>
            <input type="text" id="sqft" inputmode="numeric" aria-describedby="sqft-note sqft-err">
            <div class="small" id="sqft-note"></div>
            <label class="check" id="county-wrap" hidden><input type="checkbox" id="county-use"><span id="s-county-use"></span></label>
            <div class="ferr" id="sqft-err"></div>
          </div>
          <div class="field">
            <label for="btype" id="s-btype"></label>
            <select id="btype" aria-describedby="btype-err"></select>
            <div class="ferr" id="btype-err"></div>
          </div>
          <div class="field">
            <label for="hfuel" id="s-hfuel"></label>
            <select id="hfuel" aria-describedby="hfuel-err"></select>
            <div class="ferr" id="hfuel-err"></div>
          </div>
        </div>

        <fieldset style="border:0;padding:0;margin:0 0 10px">
          <legend class="small" id="s-reasons"></legend>
          <div id="reasons"></div>
        </fieldset>

        <div class="field">
          <label for="shared" id="s-shared"></label>
          <input type="text" id="shared" maxlength="255">
        </div>

        <div id="month-controls" class="row2" style="align-items:end">
          <div>
            <label for="startmonth" id="s-startmonth"></label>
            <input type="month" id="startmonth">
          </div>
          <div>
            <label for="gasunit" id="s-gasunit"></label>
            <select id="gasunit">
              <option value="therms"></option><option value="ccf"></option>
            </select>
            <div class="small" id="s-gasunit-hint"></div>
          </div>
        </div>

        <div id="monthly-block">
          <div class="tablewrap">
            <table class="grid" id="grid" aria-describedby="s-paste-hint">
              <thead><tr>
                <th id="th-month"></th><th id="th-ekwh"></th><th id="th-ecost"></th><th id="th-gus"></th><th id="th-gcost"></th>
              </tr></thead>
              <tbody id="grid-body"></tbody>
              <tfoot><tr>
                <td id="tot-label"></td><td id="tot-ekwh">0</td><td id="tot-ecost">$0</td><td id="tot-gus">0</td><td id="tot-gcost">$0</td>
              </tr></tfoot>
            </table>
          </div>
          <div class="small" id="s-paste-hint"></div>
          <div id="rate-line" class="okline" aria-live="polite"></div>
          <div id="hints" aria-live="polite"></div>
          <div class="ferr" id="table-err"></div>
          <button class="linkbtn" id="to-annual" type="button"></button>
        </div>

        <div id="annual-block" hidden>
          <div class="row2">
            <div><label for="ann-e" id="s-ann-e"></label><input type="text" id="ann-e" inputmode="decimal"><div class="ferr" id="ann-e-err"></div></div>
            <div><label for="ann-g" id="s-ann-g"></label><input type="text" id="ann-g" inputmode="decimal"></div>
          </div>
          <button class="linkbtn" id="to-monthly" type="button"></button>
        </div>

        <h3 id="s-contact"></h3>
        <div class="row3">
          <div class="field"><label for="c-name" id="s-cname"></label><input type="text" id="c-name" autocomplete="name"><div class="ferr" id="c-name-err"></div></div>
          <div class="field"><label for="c-email" id="s-cemail"></label><input type="email" id="c-email" autocomplete="email"><div class="ferr" id="c-email-err"></div></div>
          <div class="field"><label for="c-phone" id="s-cphone"></label><input type="tel" id="c-phone" autocomplete="tel"></div>
        </div>
        <label class="check"><input type="checkbox" id="consent"><span id="s-consent"></span></label>
        <div class="ferr" id="consent-err"></div>

        <div class="hp" aria-hidden="true"><label>Website<input type="text" id="website" tabindex="-1" autocomplete="off" value=""></label></div>

        <div id="errsummary" class="errbox" role="alert" hidden></div>
        <button class="primary" id="submit" type="button"></button>
      </div>

      <div id="working" class="results" role="status" aria-live="polite" hidden>
        <span class="spinner"></span><span id="s-working"></span>
      </div>

      <div id="queued" class="results" role="status" aria-live="polite" hidden>
        <p id="queued-msg"></p>
        <div class="buttons"><button class="secondary" id="q-again" type="button"></button></div>
      </div>

      <div id="results" class="results" aria-live="polite" hidden></div>
    </section>

    <!-- RIGHT: Energy assessments (bill upload -> Desk audit) -->
    <section class="panel" id="ea-panel" aria-labelledby="ea-title" tabindex="-1">
      <h2 id="ea-title"></h2>
      <p class="small" id="ea-sub"></p>

      <div id="ea-form">
        <div class="drop" id="ea-drop" tabindex="0" role="button" aria-describedby="ea-drop-note">
          <div id="ea-drop-t"></div>
          <div class="small" id="ea-drop-note"></div>
          <input type="file" id="ea-file" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" hidden>
        </div>
        <div class="small" id="ea-count" aria-live="polite"></div>
        <ul class="filelist" id="ea-files"></ul>
        <div class="ferr" id="ea-files-err"></div>

        <h3 id="ea-choose"></h3>
        <label class="check"><input type="checkbox" id="ea-desk" checked><span id="ea-desk-l"></span></label>
        <label class="check small"><input type="checkbox" id="ea-solar" disabled><span id="ea-solar-l"></span></label>
        <label class="check small"><input type="checkbox" disabled><span id="ea-proc-l"></span></label>

        <h3 id="ea-about"></h3>
        <div class="field">
          <label for="ea-sqft" id="s-ea-sqft"></label>
          <input type="text" id="ea-sqft" inputmode="numeric" aria-describedby="ea-sqft-err">
          <div class="ferr" id="ea-sqft-err"></div>
        </div>
        <div id="ea-manual" hidden>
          <div class="row2">
            <div class="field"><label for="ea-mtype" id="s-ea-mtype"></label><select id="ea-mtype"></select><div class="ferr" id="ea-mtype-err"></div></div>
            <div class="field"><label for="ea-maddr" id="s-ea-maddr"></label><input type="text" id="ea-maddr"><div class="ferr" id="ea-maddr-err"></div></div>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label for="ea-first" id="s-ea-first"></label><input type="text" id="ea-first" autocomplete="given-name"><div class="ferr" id="ea-first-err"></div></div>
          <div class="field"><label for="ea-last" id="s-ea-last"></label><input type="text" id="ea-last" autocomplete="family-name"><div class="ferr" id="ea-last-err"></div></div>
        </div>
        <div class="row2">
          <div class="field"><label for="ea-email" id="s-ea-email"></label><input type="email" id="ea-email" autocomplete="email"><div class="ferr" id="ea-email-err"></div></div>
          <div class="field"><label for="ea-phone" id="s-ea-phone"></label><input type="tel" id="ea-phone" autocomplete="tel"></div>
        </div>
        <label class="check"><input type="checkbox" id="ea-consent"><span id="s-ea-consent"></span></label>
        <div class="ferr" id="ea-consent-err"></div>

        <div id="ea-errsummary" class="errbox" role="alert" hidden></div>
        <button class="primary" id="ea-submit" type="button" style="margin-top:10px"></button>
        <p class="small" id="ea-note" style="margin-top:8px;text-align:center"></p>
      </div>

      <div id="ea-progress" hidden>
        <p id="ea-prog-title" role="status" aria-live="polite"><span class="spinner"></span><span id="ea-prog-text"></span></p>
        <ul class="filelist" id="ea-prog-files"></ul>
      </div>

      <div id="ea-done" hidden role="status" aria-live="polite">
        <div class="okbox" id="ea-done-msg"></div>
        <div id="ea-failed" hidden>
          <p id="ea-failed-t"></p>
          <ul class="filelist" id="ea-failed-list"></ul>
          <button class="secondary" id="ea-retry" type="button"></button>
        </div>
        <div class="buttons"><button class="secondary" id="ea-another" type="button"></button></div>
      </div>
    </section>
  </div>
</div>

<script>

  ['comfort','Ongoing comfort, equipment or high-bill complaints'],['deadline','A grant, requirement or budget deadline applies']];

/* ------------------------------------------------------------------ helpers */
function $(id){ return document.getElementById(id); }
function el(tag, attrs, text){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
  if (text != null) e.textContent = text;
  return e;
}
function fill(str, map){ return str.replace(/\{(\w+)\}/g, function(_, k){ return map[k] != null ? map[k] : ''; }); }
function fmtInt(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtMoney(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8); return v.toString(16); });
}
// null = blank, NaN = not a number, else number. Strips $, spaces and thousands commas.
function parseNum(s){
  if (s == null) return null;
  var t = String(s).replace(/[$\s]/g,'').replace(/,/g,'');
  if (t === '') return null;
  return /^-?\d*\.?\d+$/.test(t) ? Number(t) : NaN;
}
function postHeight(){
  var h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
  try { parent.postMessage({type:'ceEscoHeight', height:h}, '*'); } catch(e){}
}
function scrollParentTo(node){
  var y = node.getBoundingClientRect().top + window.scrollY;
  try { parent.postMessage({type:'ceEscoScroll', top:y}, '*'); } catch(e){}
  node.scrollIntoView({behavior:'smooth', block:'start'});
}

function findAccounts(){
  var zip = $('zip').value.replace(/\D/g,'').slice(0,5);
  if (zip.length !== 5){ lkStatus(S.noAccounts); return; }
  state.zip = zip; clearLists(); $('lk-manual').hidden = true; lkStatus(S.searching);
  getJSON('/accounts?zip=' + encodeURIComponent(zip)).then(function(d){
    var list = (d && d.accounts) || [];
    if (!list.length){ lkStatus(S.noAccounts); postHeight(); return; }
    lkStatus(S.pickAccount);
    list.forEach(function(a){
      var li = el('li'); var b = el('button',{type:'button'}); b.appendChild(document.createTextNode(a.name || ''));
      if (a.address){ b.appendChild(el('span',{'class':'addr'},a.address)); }
      b.addEventListener('click', function(){ pickAccount(a); });
      li.appendChild(b); $('lk-accounts').appendChild(li);
    });
    postHeight();
  }).catch(function(){ lkStatus(S.lookupFail); });
}

/* ------------------------------------------------------------------ the table */
var rows = [];   // 12 month descriptors: {key:'2025-06', label:'Jun 2025'}
function defaultStart(){
  var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 12);   // 12 completed months back from last completed
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function buildRows(){
  var v = $('startmonth').value || defaultStart();
  var y = parseInt(v.slice(0,4),10), m = parseInt(v.slice(5,7),10) - 1;
  rows = [];
  for (var i = 0; i < 12; i++){
    var yy = y + Math.floor((m + i) / 12), mm = (m + i) % 12;
    rows.push({key: yy + '-' + String(mm+1).padStart(2,'0'), label: MONTHS[mm] + ' ' + yy});
  }
  var tb = $('grid-body'); var old = readCells(); tb.textContent = '';
  rows.forEach(function(r, i){
    var tr = el('tr'); tr.appendChild(el('td',{'class':'m'}, r.label));
    for (var c = 0; c < 4; c++){
      var td = el('td'); var inp = el('input',{type:'text',inputmode:'decimal','data-r':i,'data-c':c,
        'aria-label': r.label + ', ' + [S.thEkwh,S.thEcost,S.thGus,S.thGcost][c], autocomplete:'off'});
      if (old[i] && old[i][c] != null) inp.value = old[i][c];
      td.appendChild(inp); tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
  refreshTotals();
}
function readCells(){
  var out = [], inputs = $('grid-body').querySelectorAll('input');
  for (var k = 0; k < inputs.length; k++){
    var r = +inputs[k].getAttribute('data-r'), c = +inputs[k].getAttribute('data-c');
    (out[r] = out[r] || [])[c] = inputs[k].value;
  }
  return out;
}
function cell(r, c){ return $('grid-body').querySelector('input[data-r="'+r+'"][data-c="'+c+'"]'); }

$('startmonth').addEventListener('change', function(){ buildRows(); edited(); });
$('gasunit').addEventListener('change', function(){ refreshTotals(); edited(); });

// Enter moves down a column; paste fills the grid.
$('grid-body').addEventListener('keydown', function(e){
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  e.preventDefault();
  var r = +e.target.getAttribute('data-r'), c = +e.target.getAttribute('data-c');
  var nxt = cell(Math.min(r + 1, 11), c); if (nxt) nxt.focus();
});
$('grid-body').addEventListener('input', function(){ refreshTotals(); edited(); });
$('grid-body').addEventListener('paste', function(e){
  var t = (e.clipboardData || window.clipboardData).getData('text');
  if (!t || !e.target.matches('input')) return;
  var lines = t.replace(/\r/g,'').split('\n').filter(function(l){ return l.trim() !== ''; });
  if (lines.length === 1 && lines[0].indexOf('\t') < 0 && !/[;]|,\s/.test(lines[0])) return; // single plain value: normal paste
  e.preventDefault();
  var r0 = +e.target.getAttribute('data-r'), c0 = +e.target.getAttribute('data-c'), r = r0;
  lines.forEach(function(line){
    // Tabs first. Otherwise split on ";" or ", " (comma+space) so thousands commas like 18,660 survive.
    var parts = line.indexOf('\t') >= 0 ? line.split('\t') : line.split(/;|,\s+|\s{2,}/);
    parts = parts.map(function(p){ return p.trim(); });
    var nums = parts.map(parseNum);
    if (nums.every(function(n){ return n == null || isNaN(n); })) return;   // header row: skip
    if (parts.length === 5 && (nums[0] == null || isNaN(nums[0]))){ parts = parts.slice(1); }   // leading month label
    if (r > 11) return;
    parts.forEach(function(p, j){
      var c = c0 + j; if (c > 3) return;
      var inp = cell(r, c); if (inp) inp.value = p.replace(/^\$/,'');
    });
    r++;
  });
  refreshTotals(); edited();
});

function gasFactor(){ return $('gasunit').value === 'ccf' ? 1.037 : 1; }
function sums(){
  var cells = readCells(), t = {ek:0, ec:0, gu:0, gc:0, eRows:0, ekPaired:0, ecPaired:0, gPaired:0, guPaired:0, gcPaired:0, months:[]};
  for (var i = 0; i < 12; i++){
    var c = cells[i] || [];
    var ek = parseNum(c[0]), ec = parseNum(c[1]), gu = parseNum(c[2]), gc = parseNum(c[3]);
    if (ek != null && !isNaN(ek)) t.ek += ek;
    if (ec != null && !isNaN(ec)) t.ec += ec;
    if (gu != null && !isNaN(gu)) t.gu += gu;
    if (gc != null && !isNaN(gc)) t.gc += gc;
    if (ek != null && ec != null && !isNaN(ek) && !isNaN(ec)){ t.eRows++; t.ekPaired += ek; t.ecPaired += ec; t.months.push({label:rows[i].label, ek:ek}); }
    if (gu != null && gc != null && !isNaN(gu) && !isNaN(gc)){ t.gPaired++; t.guPaired += gu; t.gcPaired += gc; }
  }
  return t;
}
function refreshTotals(){
  var t = sums();
  $('tot-ekwh').textContent = fmtInt(t.ek); $('tot-ecost').textContent = fmtMoney(t.ec);
  $('tot-gus').textContent = fmtInt(t.gu); $('tot-gcost').textContent = fmtMoney(t.gc);
  // soft hints (never block)
  var hints = [], rate = '';
  if (t.ekPaired > 0){
    var r = t.ecPaired / t.ekPaired;
    if (r < 0.03 || r > 0.60) hints.push(fill(S.hintKwh, {r: r.toFixed(3)}));
    else rate = fill(S.rateOk, {r: r.toFixed(3)});
  }
  if (t.guPaired > 0){
    var gr = t.gcPaired / (t.guPaired * gasFactor());
    if (gr < 0.30 || gr > 3.00) hints.push(fill(S.hintTherm, {r: gr.toFixed(2)}));
  }
  var hf = $('hfuel').value;
  if (hf === 'gas' && t.gu === 0 && t.gc === 0) hints.push(S.hintNoGas);
  if ((hf === 'oil' || hf === 'steam')) hints.push(S.hintOilSteam);
  if (t.months.length >= 4){
    var sorted = t.months.map(function(m){return m.ek;}).sort(function(a,b){return a-b;});
    var med = sorted[Math.floor(sorted.length/2)];
    if (med > 0) t.months.forEach(function(m){ if (m.ek > 3*med) hints.push(fill(S.hintSpike, {m: m.label.split(' ')[0]})); });
  }
  if (t.eRows > 0 && t.eRows < 12) hints.push(S.fewMonths);
  setText('rate-line', rate);
  var hb = $('hints'); hb.textContent = '';
  hints.forEach(function(h){ hb.appendChild(el('div',{'class':'hint'},h)); });
  postHeight();
}

var errs;
function addErr(field, id, msg){ errs.push({field:field, id:id, message:msg}); }
function clearErrs(){
  ['sqft-err','btype-err','hfuel-err','table-err','ann-e-err','c-name-err','c-email-err','consent-err'].forEach(function(i){ setText(i,''); });
  var bad = document.querySelectorAll('.bad'); for (var i=0;i<bad.length;i++) bad[i].classList.remove('bad');
  $('errsummary').hidden = true; $('errsummary').textContent = '';
}
function showErrs(list){
  clearErrs();
  var ul = el('ul');
  list.forEach(function(e){
    ul.appendChild(el('li',null,e.message));
    if (e.id){
      var inl = $(e.id + '-err'); if (inl) inl.textContent = e.message;
      var f = $(e.id); if (f) f.classList.add('bad');
    }
  });
  var box = $('errsummary'); box.appendChild(el('strong',null,'Please fix the following:')); box.appendChild(ul); box.hidden = false;
  var first = list[0] && list[0].id && $(list[0].id); if (first) first.focus(); else box.scrollIntoView({block:'center'});
  postHeight();
}
function validate(){
  errs = [];
  var sq = parseNum($('sqft').value);
  if (sq == null || isNaN(sq) || sq < 1 || sq > 5000000 || Math.round(sq) !== sq) addErr('facts.sqft_total','sqft','Enter the total square feet as a whole number from 1 to 5,000,000.');
  if (!$('btype').value) addErr('facts.building_type','btype','Choose a building type.');
  if (!$('hfuel').value) addErr('facts.heating_fuel','hfuel','Choose the heating fuel.');
  if (state.mode === 'annual'){
    var ae = parseNum($('ann-e').value);
    if (ae == null || isNaN(ae) || ae <= 0 || ae > 10000000) addErr('annual.electric_cost','ann-e','Enter the annual electric cost.');
    var ag = parseNum($('ann-g').value);
    if (ag != null && (isNaN(ag) || ag < 0 || ag > 10000000)) addErr('annual.gas_cost','ann-g','Enter the annual gas cost as a number, or leave it blank.');
  } else {
    var cells = readCells(), complete = 0;
    for (var i = 0; i < 12; i++){
      var c = cells[i] || [];
      var pairs = [[0,1,'kWh','cost'],[2,3,'gas usage','gas cost']];
      pairs.forEach(function(p, pi){
        var u = parseNum(c[p[0]]), k = parseNum(c[p[1]]);
        var bad = false;
        [[u,p[0]],[k,p[1]]].forEach(function(v){
          if (v[0] != null && isNaN(v[0])){ bad = true; var x = cell(i, v[1]); if (x) x.classList.add('bad'); }
        });
        if (bad){ addErr('row'+i, null, rows[i].label + ': enter numbers only.'); return; }
        var maxU = 100000000, maxC = 10000000;
        if ((u != null && (u < 0 || u > maxU)) || (k != null && (k < 0 || k > maxC))){
          addErr('row'+i, null, rows[i].label + ': a figure is outside the allowed range.'); return; }
        if ((u == null) !== (k == null)){
          var what = u == null ? p[2] : p[3];
          addErr('row'+i, null, rows[i].label + ': ' + fill(S.oneCell, {what: what}));
          var x2 = cell(i, u == null ? p[0] : p[1]); if (x2) x2.classList.add('bad');
          return;
        }
        if (pi === 0 && u != null && k != null) complete++;
      });
    }
    if (complete < 6) addErr('accounts','table', S.needSix);
  }
  var nm = $('c-name').value.trim(); if (!nm) addErr('contact.name','c-name','Enter your name.');
  var em = $('c-email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) addErr('contact.email','c-email','Enter an email address we can reach you at.');
  if (!$('consent').checked) addErr('consent','consent','Please tick the box to agree.');
  return errs;
}
function buildPayload(){
  var b = state.building, acc = state.account;
  var reasons = []; var rc = document.querySelectorAll('input[name=reason]:checked'); for (var i=0;i<rc.length;i++) reasons.push(rc[i].value);
  var useCounty = $('county-use').checked && !$('county-wrap').hidden;
  var p = {
    submission_id: state.submissionId,
    mode: state.mode,
    building: {account_id: acc ? acc.id : '', building_id: b.id || '', name: b.name || '', address: b.address || '', zip: state.zip},
    facts: {
      sqft_total: parseNum($('sqft').value),
      sqft_county: (b.sqft_county && typeof b.sqft === 'number') ? b.sqft : null,
      sqft_confirmed_county: !!useCounty,
      building_type: $('btype').value, heating_fuel: $('hfuel').value,
      reasons: reasons, shared_meter_note: $('shared').value.trim()
    },
    contact: {name: $('c-name').value.trim(), email: $('c-email').value.trim(), phone: $('c-phone').value.trim()},
    consent: true,
    website: $('website').value
  };
  if (state.mode === 'annual'){
    var ag = parseNum($('ann-g').value);
    p.annual = {electric_cost: parseNum($('ann-e').value), gas_cost: ag == null ? 0 : ag};
  } else {
    var cells = readCells(), er = [], gr = [];
    for (var i2 = 0; i2 < 12; i2++){
      var c = cells[i2] || [];
      var ek = parseNum(c[0]), ec = parseNum(c[1]), gu = parseNum(c[2]), gc = parseNum(c[3]);
      if (ek != null && ec != null) er.push({month: rows[i2].key, usage: ek, cost: ec});
      if (gu != null && gc != null) gr.push({month: rows[i2].key, usage: gu, cost: gc});
    }
    p.accounts = [{label:'Electric 1', fuel:'electric', unit:'kwh', rows: er}];
    if (gr.length) p.accounts.push({label:'Gas 1', fuel:'gas', unit: $('gasunit').value, rows: gr});
  }
  return p;
}

/* ------------------------------------------------------------------ submit + states */
function edited(){ if (!state.busy) state.submissionId = null; }   // new data, new attempt
function show(which){
  $('ia-form').hidden = which !== 'form';
  $('working').hidden = which !== 'working';
  $('queued').hidden = which !== 'queued';
  $('results').hidden = which !== 'results';
  postHeight();
}
$('submit').addEventListener('click', function(){
  var e = validate();
  if (e.length){ showErrs(e); return; }
  clearErrs();
  if (!state.submissionId) state.submissionId = uuid();   // reused on retry: the middleware treats it as an idempotency key
  var payload = buildPayload();
  state.busy = true; $('submit').disabled = true; show('working');
  var ctl = new AbortController(); var to = setTimeout(function(){ ctl.abort(); }, 30000);
  fetch(API + '/instant-audit', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload), signal: ctl.signal})
  .then(function(r){ return r.json().catch(function(){ return null; }).then(function(d){ return {status:r.status, body:d}; }); })
  .then(function(res){
    clearTimeout(to); state.busy = false; $('submit').disabled = false;
    if (res.status === 429){ show('form'); showErrs([{message:S.busy}]); return; }
    if (res.status === 400 && res.body && res.body.errors){
      show('form'); showErrs(res.body.errors.map(function(x){ return {message:x.message || 'Check this entry.', id:fieldToId(x.field)}; })); return; }
    if (res.status >= 200 && res.status < 300 && res.body){
      if (res.body.status === 'complete' && res.body.result){ renderResult(res.body); return; }
      if (res.body.status === 'queued'){ renderQueued(res.body); return; }
    }
    show('form'); showErrs([{message:S.failed}]);
  })
  .catch(function(){
    clearTimeout(to); state.busy = false; $('submit').disabled = false;
    show('form'); showErrs([{message:S.failed}]);
  });
});
function fieldToId(f){
  if (!f) return null;
  if (f === 'facts.sqft_total') return 'sqft';
  if (f === 'facts.building_type') return 'btype';
  if (f === 'facts.heating_fuel') return 'hfuel';
  if (f === 'contact.name') return 'c-name';
  if (f === 'contact.email') return 'c-email';
  if (f === 'consent') return 'consent';
  if (f.indexOf('annual.electric') === 0) return 'ann-e';
  return null;
}

/* queued: show the middleware's message, then poll for up to 60 s */
function stopPoll(){ if (state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; } }
function renderQueued(body){
  setText('queued-msg', body.message || '');
  setText('q-again', S.another); show('queued'); scrollParentTo($('queued'));
  stopPoll(); var started = Date.now();
  state.pollTimer = setInterval(function(){
    if (Date.now() - started > 60000){ stopPoll(); return; }
    fetch(API + '/instant-audit/' + encodeURIComponent(state.submissionId))
      .then(function(r){ if (r.status === 404){ stopPoll(); return null; } return r.json(); })
      .then(function(d){ if (d && d.status === 'complete' && d.result){ stopPoll(); renderResult(d); } })
      .catch(function(){});
  }, 3000);
}
$('q-again').addEventListener('click', startAnother);

/* result: everything shown comes from the JSON; written with textContent only */
function renderResult(body){
  stopPoll();
  var r = body.result, box = $('results'); box.textContent = '';
  var light = (r.light === 'green' || r.light === 'yellow') ? r.light : 'red';
  var chip = el('span',{'class':'chip ' + light}, (SHOW_LIGHT_WORD ? (r.light + ': ') : '') + (r.headline || ''));
  box.appendChild(chip);
  if (typeof r.annual_spend === 'number') box.appendChild(el('div',{'class':'spend'}, fill(S.perYear, {n: fmtMoney(r.annual_spend)})));
  if (r.basis_label) box.appendChild(el('div',{'class':'basis'}, r.basis_label));
  var sm = r.summary || {};
  if (sm.used && sm.used.length){
    var ul = el('ul');
    sm.used.forEach(function(u){ var li = el('li'); li.appendChild(el('strong',null,(u.lead || '') + ' ')); li.appendChild(document.createTextNode(u.text || '')); ul.appendChild(li); });
    box.appendChild(ul);
  }
  if (sm.means) box.appendChild(el('p',null,sm.means));
  if (sm.next) box.appendChild(el('p',null,sm.next));
  if (sm.note) box.appendChild(el('p',{'class':'small'},sm.note));
  if (r.honesty_line) box.appendChild(el('p',{'class':'small'},r.honesty_line));
  var btns = el('div',{'class':'buttons'}); box.appendChild(btns);
  var slot = el('span'); btns.appendChild(slot);
  renderReport(body.report, slot, body.submission_id || state.submissionId);
  var cb = el('button',{type:'button','class':'secondary'},S.checkBills);
  cb.addEventListener('click', function(){ $('ea-desk').checked = true; prefillRight(); var p = $('ea-panel'); scrollParentTo(p); p.focus(); });
  btns.appendChild(cb);
  var again = el('button',{type:'button','class':'secondary'},S.another); again.addEventListener('click', startAnother); btns.appendChild(again);
  show('results'); scrollParentTo(box);
}
function renderReport(rep, slot, id){
  slot.textContent = '';
  if (!rep || rep.state === 'unavailable') return;
  if (rep.state === 'ready' && rep.url && /^https:\/\//.test(rep.url)){
    var a = el('a',{href:rep.url,'class':'secondary',download: rep.filename || 'Instant_Audit_Report.pdf',rel:'noopener'}, S.reportBtn);
    slot.appendChild(a); return;
  }
  if (rep.state === 'preparing'){
    slot.appendChild(el('span',{'class':'small'}, S.reportPrep));
    var started = Date.now();
    var t = setInterval(function(){
      if (Date.now() - started > 60000){ clearInterval(t); slot.textContent = ''; return; }
      fetch(API + '/instant-audit/' + encodeURIComponent(id)).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
        if (d && d.report && d.report.state !== 'preparing'){ clearInterval(t); renderReport(d.report, slot, id); postHeight(); }
      }).catch(function(){});
    }, 3000);
  }
}

/* ------------------------------------------------------------------ reset */
function resetForm(keepBuilding){
  stopPoll(); state.submissionId = null; state.busy = false; $('submit').disabled = false;
  state.mode = 'monthly'; $('monthly-block').hidden = false; $('month-controls').hidden = false; $('annual-block').hidden = true;
  ['btype','hfuel'].forEach(function(i){ $(i).value = ''; });
  ['shared','ann-e','ann-g','c-name','c-email','c-phone','website'].forEach(function(i){ $(i).value = ''; });
  $('consent').checked = false; $('county-use').checked = false;
  var rc = document.querySelectorAll('input[name=reason]'); for (var i=0;i<rc.length;i++) rc[i].checked = false;
  $('startmonth').value = defaultStart(); $('gasunit').value = 'therms';
  // map the building's recorded type to our list only when it matches exactly (never guess)
  if (keepBuilding && state.building && state.building.type){
    var m = {'Worship':'worship','School':'school','Office':'office-chancery','Residence':'residence'}[state.building.type];
    if (m) $('btype').value = m;
  }
  $('grid-body').textContent = ''; buildRows(); clearErrs(); show('form');
}
function startAnother(){
  resetForm(false);
  resetRight();
  state.building = null; state.account = null;
  $('step1-body').hidden = false; $('step1-change').hidden = true; $('step1-sel').textContent = '';
  $('step2').hidden = true; clearLists(); lkStatus(''); $('lk-manual').hidden = true; $('zip').value = '';
  scrollParentTo($('step1')); postHeight();
}
['sqft','btype','shared','ann-e','ann-g','c-name','c-email','c-phone','consent'].forEach(function(i){
  $(i).addEventListener('input', edited); $(i).addEventListener('change', edited);
});


/* ------------------------------------------------------------------ Energy assessments: bill upload (Desk audit) */
var MAX_FILES = 36, MAX_BYTES = 25 * 1024 * 1024, BILL_EXT = /\.(pdf|jpe?g|png)$/i;
var ea = { files: [], up: null, busy: false };

function eaClearErrs(){
  ['ea-files-err','ea-sqft-err','ea-mtype-err','ea-maddr-err','ea-first-err','ea-last-err','ea-email-err','ea-consent-err'].forEach(function(i){ setText(i,''); });
  var bad = $('ea-panel').querySelectorAll('.bad'); for (var i=0;i<bad.length;i++) bad[i].classList.remove('bad');
  $('ea-errsummary').hidden = true; $('ea-errsummary').textContent = '';
}
function eaShowErrs(list){
  eaClearErrs();
  var ul = el('ul');
  list.forEach(function(e){
    ul.appendChild(el('li',null,e.message));
    if (e.id){ var inl = $(e.id + '-err'); if (inl) inl.textContent = e.message; var f = $(e.id); if (f) f.classList.add('bad'); }
  });
  var box = $('ea-errsummary'); box.appendChild(el('strong',null,'Please fix the following:')); box.appendChild(ul); box.hidden = false;
  var first = list[0] && list[0].id && $(list[0].id); if (first && first.focus) first.focus(); else box.scrollIntoView({block:'center'});
  postHeight();
}
function eaRender(){
  var ul = $('ea-files'); ul.textContent = '';
  var total = 0;
  ea.files.forEach(function(f, i){
    total += f.size;
    var li = el('li'); li.appendChild(el('span',{'class':'nm'}, f.name));
    li.appendChild(el('span',{'class':'st'}, (f.size/1048576).toFixed(1) + ' MB'));
    var rm = el('button',{type:'button','aria-label':S.eaRemove + ' ' + f.name}, S.eaRemove);
    rm.addEventListener('click', function(){ ea.files.splice(i,1); eaRender(); });
    li.appendChild(rm); ul.appendChild(li);
  });
  setText('ea-count', ea.files.length ? fill(S.eaCount, {n: ea.files.length, mb: (total/1048576).toFixed(1)}) : '');
  postHeight();
}
function eaAdd(list){
  var msgs = [];
  Array.prototype.forEach.call(list, function(f){
    if (!BILL_EXT.test(f.name)){ msgs.push(fill(S.eaBadType,{name:f.name})); return; }
    if (!(f.size > 0)){ msgs.push(fill(S.eaEmpty,{name:f.name})); return; }
    if (f.size > MAX_BYTES){ msgs.push(fill(S.eaTooBig,{name:f.name})); return; }
    if (ea.files.some(function(x){ return x.name === f.name && x.size === f.size; })) return;
    if (ea.files.length >= MAX_FILES){ if (msgs.indexOf(S.eaTooMany) < 0) msgs.push(S.eaTooMany); return; }
    ea.files.push(f);
  });
  eaRender();
  setText('ea-files-err', msgs.join(' '));
}
$('ea-drop').addEventListener('click', function(){ $('ea-file').click(); });
$('ea-drop').addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('ea-file').click(); } });
$('ea-file').addEventListener('change', function(){ eaAdd(this.files); this.value = ''; });
['dragenter','dragover'].forEach(function(ev){ $('ea-drop').addEventListener(ev, function(e){ e.preventDefault(); this.classList.add('over'); }); });
['dragleave','drop'].forEach(function(ev){ $('ea-drop').addEventListener(ev, function(e){ e.preventDefault(); this.classList.remove('over'); }); });
$('ea-drop').addEventListener('drop', function(e){ if (e.dataTransfer && e.dataTransfer.files) eaAdd(e.dataTransfer.files); });

// Copy what the client already typed on the left so nothing is retyped (never overwrites right-hand entries).
function prefillRight(){
  if (!$('ea-sqft').value && $('sqft').value) $('ea-sqft').value = $('sqft').value;
  var nm = $('c-name').value.trim();
  if (nm && !$('ea-first').value && !$('ea-last').value){
    var i = nm.lastIndexOf(' ');
    if (i > 0){ $('ea-first').value = nm.slice(0,i).trim(); $('ea-last').value = nm.slice(i+1).trim(); }
    else { $('ea-first').value = nm; }
  }
  if (!$('ea-email').value) $('ea-email').value = $('c-email').value;
  if (!$('ea-phone').value) $('ea-phone').value = $('c-phone').value;
  if (!$('ea-consent').checked && $('consent').checked) $('ea-consent').checked = true;
}

function eaValidate(){
  var out = [];
  if (!ea.files.length) out.push({id:'ea-files', message:S.eaNoFiles});
  if (!$('ea-desk').checked) out.push({id:null, message:S.eaNeedChoice});
  var sq = parseNum($('ea-sqft').value);
  if (sq == null || isNaN(sq) || sq <= 0 || sq > 5000000) out.push({id:'ea-sqft', message:'Enter the total square feet as a number.'});
  if (state.building && state.building.manual){
    if (!$('ea-mtype').value) out.push({id:'ea-mtype', message:'Choose the building type.'});
    if (!$('ea-maddr').value.trim()) out.push({id:'ea-maddr', message:'Enter the full street address.'});
  }
  if (!$('ea-first').value.trim()) out.push({id:'ea-first', message:'Enter your first name.'});
  if (!$('ea-last').value.trim()) out.push({id:'ea-last', message:'Enter your last name.'});
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('ea-email').value.trim())) out.push({id:'ea-email', message:'Enter an email address we can reach you at.'});
  if (!$('ea-consent').checked) out.push({id:'ea-consent', message:'Please tick the box to agree.'});
  return out;
}

function postJSON(path, body){
  return fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return null; }).then(function(d){ return {status:r.status, body:d}; }); });
}
function toBase64(file){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ var s = String(fr.result); resolve(s.slice(s.indexOf(',') + 1)); };   // strip "data:...;base64,"
    fr.onerror = function(){ reject(new Error('read')); };
    fr.readAsDataURL(file);
  });
}
function eaShow(which){
  $('ea-form').hidden = which !== 'form'; $('ea-progress').hidden = which !== 'progress'; $('ea-done').hidden = which !== 'done';
  postHeight();
}
function eaProgList(files, ul){
  ul.textContent = '';
  var cells = {};
  files.forEach(function(f){
    var li = el('li'); li.appendChild(el('span',{'class':'nm'}, f.name));
    var st = el('span',{'class':'st'}, S.eaStatusWait); li.appendChild(st); ul.appendChild(li); cells[f.name + '|' + f.size] = st;
  });
  return function(f, text, cls){ var c = cells[f.name + '|' + f.size]; if (c){ c.textContent = text; c.className = 'st ' + (cls || ''); } };
}

// Upload one bill; one automatic retry. Resolves true on success, false on failure; a 403 means the 2-hour link expired.
function eaUploadOne(f){
  var up = ea.up;
  function once(){
    return toBase64(f).then(function(b64){
      return postJSON('/screening-file', {building_id: up.buildingId, submission_id: up.sid, token: up.token, name: f.name, data: b64});
    });
  }
  return once().then(function(r){
    if (r.status === 403){ up.expired = true; return false; }
    if (r.body && r.body.success) return true;
    return once().then(function(r2){ return !!(r2.body && r2.body.success); });
  }).catch(function(){ return false; });
}

function eaUploadAll(files){
  var up = ea.up, mark = eaProgList(files, $('ea-prog-files')), failed = [], i = 0;
  eaShow('progress');
  function next(){
    if (i >= files.length) return Promise.resolve();
    var f = files[i++];
    setText('ea-prog-text', fill(S.eaUploading, {i: i, n: files.length}));
    mark(f, S.eaStatusUp, '');
    return eaUploadOne(f).then(function(ok){
      mark(f, ok ? S.eaStatusOk : S.eaStatusFail, ok ? 'ok' : 'fail');
      if (!ok) failed.push(f);
      return next();
    });
  }
  return next().then(function(){ return failed; });
}

function eaFinish(failed){
  var up = ea.up;
  setText('ea-prog-text', S.eaFinishing); eaShow('progress');
  return postJSON('/screening-complete', {building_id: up.buildingId, submission_id: up.sid, token: up.token,
      failed: failed.map(function(f){ return f.name; })})
    .then(function(r){
      if (!(r.body && r.body.success)) throw new Error('complete');
      up.failed = failed; eaDone();
    });
}
function eaDone(){
  var up = ea.up, n = up.failed.length;
  setText('ea-done-msg', n ? fill(S.eaDonePartial, {n: n}) : S.eaDone);
  $('ea-done-msg').className = n ? 'errbox' : 'okbox';
  var box = $('ea-failed'); box.hidden = !n; var ul = $('ea-failed-list'); ul.textContent = '';
  up.failed.forEach(function(f){ var li = el('li'); li.appendChild(el('span',{'class':'nm'}, f.name)); ul.appendChild(li); });
  ea.busy = false; $('ea-submit').disabled = false;
  eaShow('done'); scrollParentTo($('ea-panel'));
}
function eaFail(msg){ ea.busy = false; $('ea-submit').disabled = false; eaShow('form'); eaShowErrs([{message: msg}]); }

$('ea-submit').addEventListener('click', function(){
  if (ea.busy) return;
  var errs = eaValidate();
  if (errs.length){ eaShowErrs(errs); return; }
  eaClearErrs();
  var b = state.building, acc = state.account, files = ea.files.slice();
  var fuel = $('hfuel').value;
  var body = {
    sf_account_id: acc.id, upload_mode: 'separate',
    contact: {first_name: $('ea-first').value.trim(), last_name: $('ea-last').value.trim(),
              email: $('ea-email').value.trim(), phone: $('ea-phone').value.trim()},
    buildings: [{
      sf_building_id: b.manual ? 'NEW' : b.id, manually_added: !!b.manual,
      building_name: b.name || '',
      building_type: b.manual ? $('ea-mtype').value : (b.type || ''),
      building_address: b.manual ? $('ea-maddr').value.trim() : (b.address || ''),
      client_sqft: parseNum($('ea-sqft').value),
      client_confirmed_county_sqft: !!(b.sqft_county && typeof b.sqft === 'number' && parseNum($('ea-sqft').value) === b.sqft),
      county_sqft_reference: (b.sqft_county && typeof b.sqft === 'number') ? b.sqft : null,
      screening_unit: 'building',
      client_heating_fuel: fuel || '',
      client_shared_meter_note: $('shared').value.trim(),
      bill_files: files.map(function(f){ return {name: f.name, type: f.type || '', size: f.size}; })
    }]
  };
  ea.busy = true; $('ea-submit').disabled = true;
  setText('ea-prog-text', S.eaSaving); eaProgList([], $('ea-prog-files')); eaShow('progress');
  postJSON('/screening-request', body).then(function(r){
    if (r.status === 400 && r.body && r.body.errors){ return eaFail(r.body.errors.join(' ')); }
    if (!(r.body && r.body.success && r.body.records && r.body.records[0] && r.body.records[0].uploadToken)) return eaFail(S.eaFail);
    var rec = r.body.records[0];
    ea.up = {buildingId: rec.buildingId, sid: r.body.submissionId, token: rec.uploadToken, files: files, failed: [], expired: false};
    return eaUploadAll(files).then(function(failed){
      if (ea.up.expired) return eaFail(S.eaLinkExpired);
      return eaFinish(failed);
    });
  }).catch(function(){ eaFail(S.eaFail); });
});

$('ea-retry').addEventListener('click', function(){
  var up = ea.up; if (!up || !up.failed.length || ea.busy) return;
  ea.busy = true; $('ea-submit').disabled = true;
  eaUploadAll(up.failed).then(function(failed){
    if (up.expired) return eaFail(S.eaLinkExpired);
    return eaFinish(failed);
  }).catch(function(){ eaFail(S.eaFail); });
});
$('ea-another').addEventListener('click', startAnother);

function resetRight(){
  ea.files = []; ea.up = null; ea.busy = false; $('ea-submit').disabled = false;
  eaRender(); eaClearErrs();
  ['ea-sqft','ea-first','ea-last','ea-email','ea-phone','ea-maddr'].forEach(function(i){ $(i).value = ''; });
  $('ea-mtype').value = ''; $('ea-consent').checked = false; $('ea-desk').checked = true;
  var man = !!(state.building && state.building.manual);
  $('ea-manual').hidden = !man;
  if (man){ $('ea-maddr').value = state.building.address || ''; }
  eaShow('form');
}

/* ------------------------------------------------------------------ init */
$('startmonth').value = defaultStart();
buildRows();
if (window.ResizeObserver){ new ResizeObserver(postHeight).observe(document.body); }
window.addEventListener('load', postHeight);
</script>
